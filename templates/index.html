<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>To-Do List</title>
</head>
<body>
    <h1>To-Do List</h1>
    
    <form method="POST">
        <input type="text" name="task" placeholder="Add new task" required>
        <button type="submit">Add</button>
    </form>

    <ul>
        {% for task in tasks %}
            <li>
                <input type="checkbox" {% if task.done %}checked{% endif %} onclick="this.form.submit()">
                <form style="display:inline;" method="POST" action="{{ url_for('delete_task', task_id=task.id) }}">
                    <button type="submit" style="background:none; border:none;">X</button>
                </form>
                <span style="margin-left:10px;">{{ task.description }}</span>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
